name: Release
on:
  push:
    tags: ["v*"]
    branches: ["v3/integrated-preview-20260922"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  upgrade-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: python tools/fetch_nsis.py "${{ runner.temp }}/nsis"
      - run: python tools/verify_upgrade_failure.py --compiler "${{ runner.temp }}/nsis/nsis-3.12/makensis.exe" --report evidence/upgrade-failures.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-recovery-${{ github.sha }}
          path: evidence/
  package:
    needs: [validate, upgrade-recovery]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-v3-release.txt playwright==1.60.0
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m playwright install chromium
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build
      - run: python tools/export_v3_icon.py
      - name: Bind source and verify release tag
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            python tools/prepare_v3_release.py --channel stable --tag '${{ github.ref_name }}'
          } else {
            python tools/prepare_v3_release.py --channel release-candidate
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit exact installed build dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -m pip_audit --format json --output evidence/installed-dependency-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-recovery-${{ github.sha }}
          path: evidence/
      - run: python -m PyInstaller --noconfirm packaging/v3_release.spec
      - run: python tools/verify_candidate_startup.py dist/DoubaoTypeless/DoubaoTypeless.exe --report evidence/startup.json
      - run: python tools/verify_candidate_text.py dist/DoubaoTypeless/DoubaoTypeless.exe --report evidence/text.json
      - run: python tools/verify_candidate_text.py dist/DoubaoTypeless/DoubaoTypeless.exe --phone-primary --report evidence/phone-primary.json
      - run: python tools/fetch_nsis.py "${{ runner.temp }}/nsis"
      - run: python tools/package_v3_release.py dist/DoubaoTypeless --output release --compiler "${{ runner.temp }}/nsis/nsis-3.12/makensis.exe"
      - run: python tools/package_v3_release.py dist/DoubaoTypeless --output installer-test --compiler "${{ runner.temp }}/nsis/nsis-3.12/makensis.exe" --test-install
      - run: python tools/verify_v3_installer.py installer-test --payload dist/DoubaoTypeless --compiler "${{ runner.temp }}/nsis/nsis-3.12/makensis.exe" --report evidence/installer.json
      - run: python tools/verify_installer_finish.py installer-test --report evidence/installer-finish.json
      - run: python -m pip install cryptography==46.0.7
        if: ${{ !cancelled() && hashFiles('installer-test/*_Setup.exe') != '' }}
      - name: Published 0.4.2 full upgrade and restart
        if: ${{ !cancelled() && hashFiles('installer-test/*_Setup.exe') != '' }}
        shell: pwsh
        run: |
          python tools/verify_legacy_upgrade.py dist/DoubaoTypeless --compiler "${{ runner.temp }}/nsis/nsis-3.12/makensis.exe" --report evidence/legacy-upgrade.json
        timeout-minutes: 6
      - run: python tools/verify_candidate_browser.py dist/DoubaoTypeless/DoubaoTypeless.exe --report evidence/browser.json
        if: ${{ !cancelled() && hashFiles('dist/DoubaoTypeless/DoubaoTypeless.exe') != '' }}
        timeout-minutes: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/
            evidence/
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
